[project]
name = "youtube-analyzer"
version = "2.2.0"
description = "AI-powered YouTube SERP, Competitor Intelligence, Content Gaps, and SEO Optimization Engine (MCP & WebMCP)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["youtube", "seo", "mcp", "webmcp", "youtube-api", "fastapi", "ai-agents"]
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "mcp>=1.0.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pytrends>=4.9.2",
    "sqlalchemy>=2.0.38,<2.1.0",
    "sqlmodel>=0.0.22",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://youtubeanalyzer-sand.vercel.app/"
Repository = "https://github.com/dhanyled/youtube_analyzer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard.py" = ["E402"]
"login_youtube.py" = ["E402"]
